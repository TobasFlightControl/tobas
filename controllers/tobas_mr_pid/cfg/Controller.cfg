#!/usr/bin/env python3

import math
import os.path as osp
import rospkg
from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()

gen.add(
    name="horizontal_p_gain",
    paramtype=double_t,
    level=0,
    description="Proportional gain for horizontal position control.",
    default=2.25,
    min=0.0,
    max=10.0,
)
gen.add(
    name="horizontal_i_gain",
    paramtype=double_t,
    level=0,
    description="Integral gain for horizontal position control.",
    default=0.0,
    min=0.0,
    max=10.0,
)
gen.add(
    name="horizontal_d_gain",
    paramtype=double_t,
    level=0,
    description="Derivative gain for horizontal position control.",
    default=3.0,
    min=0.0,
    max=10.0,
)

gen.add(
    name="vertical_p_gain",
    paramtype=double_t,
    level=0,
    description="Proportional gain for vertical position control.",
    default=4.0,
    min=0.0,
    max=10.0,
)
gen.add(
    name="vertical_i_gain",
    paramtype=double_t,
    level=0,
    description="Integral gain for vertical position control.",
    default=0.0,
    min=0.0,
    max=10.0,
)
gen.add(
    name="vertical_d_gain",
    paramtype=double_t,
    level=0,
    description="Derivative gain for vertical position control.",
    default=4.0,
    min=0.0,
    max=10.0,
)

gen.add(
    name="attitude_p_gain",
    paramtype=double_t,
    level=0,
    description="Proportional gain for attitude control.",
    default=100.0,
    min=0.0,
    max=200.0,
)
gen.add(
    name="attitude_i_gain",
    paramtype=double_t,
    level=0,
    description="Integral gain for attitude control.",
    default=0.0,
    min=0.0,
    max=200.0,
)
gen.add(
    name="attitude_d_gain",
    paramtype=double_t,
    level=0,
    description="Derivative gain for attitude control.",
    default=20.0,
    min=0.0,
    max=200.0,
)

gen.add(
    name="heading_p_gain",
    paramtype=double_t,
    level=0,
    description="Proportional gain for heading control.",
    default=25.0,
    min=0.0,
    max=200.0,
)
gen.add(
    name="heading_i_gain",
    paramtype=double_t,
    level=0,
    description="Integral gain for heading control.",
    default=0.0,
    min=0.0,
    max=200.0,
)
gen.add(
    name="heading_d_gain",
    paramtype=double_t,
    level=0,
    description="Derivative gain for heading control.",
    default=10.0,
    min=0.0,
    max=200.0,
)

gen.add(
    name="max_horizontal_velocity",
    paramtype=double_t,
    level=0,
    description="The maximum horizontal velocity.",
    default=10.0,
    min=3.0,
    max=20.0,
)
gen.add(
    name="max_vertical_velocity",
    paramtype=double_t,
    level=0,
    description="The maximum vertical velocity.",
    default=3.0,
    min=3.0,
    max=20.0,
)
gen.add(
    name="max_horizontal_accel",
    paramtype=double_t,
    level=0,
    description="The maximum horizontal acceleration.",
    default=8.0,
    min=1.0,
    max=10.0,
)
gen.add(
    name="max_vertical_accel",
    paramtype=double_t,
    level=0,
    description="The maximum vertical acceleration.",
    default=4.0,
    min=1.0,
    max=10.0,
)

gen.add(
    name="max_attitude",
    paramtype=double_t,
    level=0,
    description="The maximum attitude angle [rad].",
    default=math.pi / 3,
    min=0.0,
    max=math.pi / 2,
)
gen.add(
    name="max_heading_error",
    paramtype=double_t,
    level=0,
    description="The maximum heading angle error [rad].",
    default=math.pi,
    min=0.0,
    max=math.pi * 2,
)

exit(
    gen.generate(
        rospkg.get_package_name(__file__),
        "tobas_mr_pid",
        osp.splitext(osp.basename(__file__))[0],
    )
)
