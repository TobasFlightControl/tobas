#!/usr/bin/env python3

import os.path as osp
import rospkg
from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()

gen.add(
    name="horizontal_natural_frequency",
    paramtype=double_t,
    level=0,
    description="The frequency at which the horizontal system would oscillate if there were no damping present",
    default=1.0,
    min=0.1,
    max=10.0,
)
gen.add(
    name="horizontal_damping_ratio",
    paramtype=double_t,
    level=0,
    description="The rate at which the horizontal system's oscillations decay over time",
    default=1.0,
    min=0.7,
    max=1.0,
)
gen.add(
    name="vertical_natural_frequency",
    paramtype=double_t,
    level=0,
    description="The frequency at which the vertical system would oscillate if there were no damping present",
    default=2.0,
    min=0.1,
    max=10.0,
)
gen.add(
    name="vertical_damping_ratio",
    paramtype=double_t,
    level=0,
    description="The rate at which the vertical system's oscillations decay over time",
    default=1.0,
    min=0.7,
    max=1.0,
)

gen.add(
    name="max_horizontal_velocity",
    paramtype=double_t,
    level=0,
    description="The maximum horizontal velocity.",
    default=3.0,
    min=1.0,
    max=10.0,
)
gen.add(
    name="max_vertical_velocity",
    paramtype=double_t,
    level=0,
    description="The maximum vertical velocity.",
    default=3.0,
    min=1.0,
    max=10.0,
)
gen.add(
    name="max_horizontal_accel",
    paramtype=double_t,
    level=0,
    description="The maximum horizontal acceleration.",
    default=5.0,
    min=1.0,
    max=10.0,
)
gen.add(
    name="max_vertical_accel",
    paramtype=double_t,
    level=0,
    description="The maximum vertical acceleration.",
    default=5.0,
    min=1.0,
    max=10.0,
)

gen.add(
    name="prediction_horizon",
    paramtype=double_t,
    level=0,
    description="The length of time used to predict the future behavior",
    default=1.0,
    min=0.1,
    max=3.0,
)
gen.add(
    name="prediction_steps",
    paramtype=int_t,
    level=0,
    description="The number of future states computed by the predictive model",
    default=10,
    min=1,
    max=30,
)
gen.add(
    name="attitude_decay",
    paramtype=double_t,
    level=0,
    description="Time constant of the decay of the roll angle and pitch angle error [s]",
    default=0.2,
    min=0.0,
    max=1.0,
)
gen.add(
    name="heading_decay",
    paramtype=double_t,
    level=0,
    description="Time constant of the decay of the yaw angle error [s]",
    default=0.2,
    min=0.0,
    max=1.0,
)
gen.add(
    name="angular_velocity_decay",
    paramtype=double_t,
    level=0,
    description="Time constant of the decay of the angular velocity error [s]",
    default=0.0,
    min=0.0,
    max=1.0,
)
gen.add(
    name="attitude_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of roll angle and pitch angle",
    default=100,
    min=1,
    max=100,
)
gen.add(
    name="heading_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of yaw angle",
    default=10,
    min=1,
    max=100,
)
gen.add(
    name="angular_velocity_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of angular velocity",
    default=1,
    min=1,
    max=100,
)
gen.add(
    name="thrust_rate_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the rate of change of thrust generated by the propellers",
    default=-3,
    min=-3,
    max=3,
)

exit(
    gen.generate(
        rospkg.get_package_name(__file__),
        "tobas_mr_pidmpc",
        osp.splitext(osp.basename(__file__))[0],
    )
)
