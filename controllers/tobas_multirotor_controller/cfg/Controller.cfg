#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add(
    "natural_frequency",
    double_t,
    0,
    "The frequency at which the system would oscillate if there were no damping present",
    min=0.1,
    max=10.,
)
gen.add(
    "damping_ratio",
    double_t,
    0,
    "The rate at which the system's oscillations decay over time",
    min=0.7,
    max=1.,
)
gen.add(
    "prediction_horizon",
    double_t,
    0,
    "The length of time used to predict the future behavior",
    min=0.1,
    max=3.,
)
gen.add(
    "prediction_steps",
    int_t,
    0,
    "The number of future states computed by the predictive model",
    min=1,
    max=30,
)
gen.add(
    "attitude_decay",
    double_t,
    0,
    "Time constant of the decay of the roll angle and pitch angle error [s]",
    min=0.,
    max=1.,
)
gen.add(
    "heading_decay",
    double_t,
    0,
    "Time constant of the decay of the yaw angle error [s]",
    min=0.,
    max=1.,
)
gen.add(
    "angular_velocity_decay",
    double_t,
    0,
    "Time constant of the decay of the angular velocity error [s]",
    min=0.,
    max=1.,
)
gen.add(
    "attitude_weight",
    int_t,
    0,
    "Weighting of roll angle and pitch angle",
    min=1,
    max=100,
)
gen.add(
    "heading_weight",
    int_t,
    0,
    "Weighting of yaw angle",
    min=1,
    max=100,
)
gen.add(
    "angular_velocity_weight",
    int_t,
    0,
    "Weighting of angular velocity",
    min=1,
    max=100,
)
gen.add(
    "thrust_force_weight",
    int_t,
    0,
    "Weighting of the thrust generated by the propellers",
    min=-6,
    max=0,
)
gen.add(
    "thrust_force_rate_weight",
    int_t,
    0,
    "Weighting of the rate of change of thrust generated by the propellers",
    min=-6,
    max=0,
)

exit(gen.generate("tobas_multirotor_controller", "tobas_multirotor_controller", "Controller"))
