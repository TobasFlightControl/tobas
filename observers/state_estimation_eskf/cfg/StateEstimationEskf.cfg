#!/usr/bin/env python3

import os.path as osp
import rospkg
from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()

gen.add(
    name="gravity_variance",
    paramtype=int_t,
    level=0,
    description="The variance of the gravitational vector estimated from the accelerometer.",
    default=100,
    min=1,
    max=1000,
)
gen.add(
    name="yaw_variance",
    paramtype=int_t,
    level=0,
    description="The variance of the yaw angle estimated from the geomagnetic field.",
    default=1,
    min=1,
    max=100,
)
gen.add(
    name="acc_bias_noise_var_log10",
    paramtype=int_t,
    level=0,
    description="The common logarithm of the variance of the observed noise in the accelerometer bias.",
    default=-5,
    min=-12,
    max=0,
)
gen.add(
    name="gyro_bias_noise_var_log10",
    paramtype=int_t,
    level=0,
    description="The common logarithm of the variance of the observation noise in the gyroscope bias.",
    default=-9,
    min=-12,
    max=0,
)

exit(
    gen.generate(
        rospkg.get_package_name(__file__),
        "state_estimator_eskf",
        osp.splitext(osp.basename(__file__))[0],
    )
)
