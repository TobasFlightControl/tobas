# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See https://github.com/pre-commit/pre-commit

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: pretty-format-json
        exclude: \.ipynb$
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - "--write-changes"
          - "--ignore-words=.codespell_words"

  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        files: \.(py|tplpy)$
        exclude: tobas_example_packages/
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        args: ["-fallback-style=none", "-i"]
        files: \.(cpp|hpp|tplcpp|tplhpp)$
        exclude: tobas_example_packages/
      - id: cmake-format
        name: cmake-format
        entry: cmake-format
        language: system
        args: ["-i"]
        files: (CMakeLists\.txt|.*\.cmake|.*\.tplcmake)$
        exclude: tobas_example_packages/
      - id: cmake-lint
        name: cmake-lint
        entry: cmake-lint
        language: system
        files: (CMakeLists\.txt|.*\.cmake|.*\.tplcmake)$
        exclude: tobas_example_packages/
