# cf. [moveit2/.pre-commit-config.yaml](https://github.com/moveit/moveit2/blob/main/.pre-commit-config.yaml)

# Preserve the bundled upstream Qwt sources byte for byte.
exclude: ^tobas_external/tobas_qwt_vendor/vendor/

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      # - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      # - id: check-executables-have-shebangs
      # - id: check-illegal-windows-names
      # - id: check-json
      - id: check-merge-conflict
      # - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      # - id: check-toml
      - id: check-vcs-permalinks
      # - id: check-xml
      # - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      # - id: detect-aws-credentials
      - id: detect-private-key
      # - id: double-quote-string-fixer
      - id: end-of-file-fixer
      # - id: file-contents-sorter
      # - id: fix-byte-order-marker
      # - id: fix-encoding-pragma
      # - id: forbid-new-submodules
      # - id: forbid-submodules
      - id: mixed-line-ending
      - id: name-tests-test
      # - id: no-commit-to-branch
      - id: pretty-format-json
        exclude: \.ipynb$
      - id: requirements-txt-fixer
      # - id: sort-simple-yaml
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - "--write-changes"
          - "--ignore-words=config/codespell_words"
        exclude: (^|/)CHANGELOG\.rst$

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: system
        files: \.(py|tplpy)$
        exclude: ^tobas_external/
      - id: black
        name: black
        entry: black
        language: system
        files: \.(py|tplpy)$
        exclude: ^tobas_external/
      - id: shfmt
        name: shfmt
        entry: shfmt
        language: system
        args: ["-w"]
        types: [shell]
        exclude: ^tobas_external/
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        args: ["--rcfile=config/shellcheckrc"]
        types: [shell]
        exclude: ^tobas_external/
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        args: ["-fallback-style=none", "-i"]
        files: \.(cpp|hpp|tplcpp|tplhpp)$
        exclude: ^tobas_external/
      - id: cmake-format
        name: cmake-format
        entry: cmake-format
        language: system
        args: ["-i"]
        files: (CMakeLists\.txt|.*\.cmake)$
      - id: cmake-lint
        name: cmake-lint
        entry: cmake-lint
        language: system
        args: ["--suppress-decorations"]
        files: (CMakeLists\.txt|.*\.cmake)$
      - id: qmlformat
        name: qmlformat
        entry: /usr/lib/qt6/bin/qmlformat
        language: system
        args: ["-i"]
        files: \.qml$
      - id: qmllint
        name: qmllint
        entry: /usr/lib/qt6/bin/qmllint --max-warnings 0
        language: system
        files: \.qml$
      - id: sort-package-dependencies
        name: sort package.xml dependency blocks
        entry: python3 tools/sort_package_dependencies
        language: system
        files: (^|/)package\.xml$
      - id: prettier-yaml
        name: prettier-yaml
        entry: prettier --write
        language: node
        language_version: lts
        additional_dependencies:
          - prettier
        types: [text]
        files: \.(mission|rviz|tbsdrn|yaml|yml)$|(^|/)\.(clang-format|clang-tidy|cmake-format)$
      - id: prettier-xml
        name: prettier-xml
        entry: prettier --write
        language: node
        language_version: lts
        additional_dependencies:
          - prettier
          - "@prettier/plugin-xml"
        types: [text]
        files: \.(dae|policy|qrc|sdf|svg|tplxml|uadf|ui|urdf|world|xacro|xml)$|(^|/)model\.config$
      - id: prettier-markdown
        name: prettier-markdown
        # Add spaces between Japanese text/punctuation and alphanumerics.
        entry: sh -c 'textlint --fix --config config/textlintrc.json "$@" && prettier --write "$@"' --
        language: node
        language_version: lts
        additional_dependencies:
          - prettier
          - textlint
          - textlint-rule-ja-space-between-half-and-full-width
        files: \.md$
      - id: normalize-japanese-punctuation
        name: normalize Japanese punctuation
        entry: python3 tools/normalize_japanese_punctuation
        language: system
        types: [text]
        exclude: ^tobas_external/
