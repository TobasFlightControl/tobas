

import os.path as osp
import rospkg
from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()

gen.add(
    name="forward_speed_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of the forward speed",
    default=1,
    min=1,
    max=100,
)
gen.add(
    name="alpha_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of the angle of attack",
    default=1,
    min=1,
    max=100,
)
gen.add(
    name="beta_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of the angle of sideslip",
    default=1,
    min=1,
    max=100,
)
gen.add(
    name="attitude_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of roll angle and pitch angle",
    default=1,
    min=1,
    max=100,
)
gen.add(
    name="angular_velocity_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of angular velocity",
    default=1,
    min=1,
    max=100,
)
gen.add(
    name="thrust_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the thrust generated by the propellers",
    default=-3,
    min=-3,
    max=3,
)
gen.add(
    name="thrust_rate_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the rate of change of thrust generated by the propellers",
    default=-1,
    min=-3,
    max=3,
)
gen.add(
    name="deflection_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the deflection angles of control surfaces",
    default=-3,
    min=-3,
    max=3,
)
gen.add(
    name="deflection_rate_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the rate of change of deflection angles of control surfaces",
    default=-1,
    min=-3,
    max=3,
)

exit(
    gen.generate(
        rospkg.get_package_name(__file__),
        "tobas_fixed_wing_lqd",
        osp.splitext(osp.basename(__file__))[0],
    )
)
