#!/usr/bin/env python3

import math
import os.path as osp
import rospkg
from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()

gen.add(
    name="horizontal_natural_frequency",
    paramtype=double_t,
    level=0,
    description="The rate at which the horizontal position oscillates in the absence of any damping or external forces.",
    default=1.0,
    min=0.1,
    max=3.0,
)
gen.add(
    name="horizontal_damping_ratio",
    paramtype=double_t,
    level=0,
    description="A dimensionless parameter that describes the extent to which oscillations in the horizontal position decay after a disturbance.",
    default=1.0,
    min=0.7,
    max=1.0,
)
gen.add(
    name="horizontal_i_gain",
    paramtype=double_t,
    level=0,
    description="Integral gain for horizontal position control.",
    default=0.1,
    min=0.1,
    max=10.0,
)

gen.add(
    name="vertical_natural_frequency",
    paramtype=double_t,
    level=0,
    description="The rate at which the vertical position oscillates in the absence of any damping or external forces.",
    default=2.0,
    min=0.1,
    max=5.0,
)
gen.add(
    name="vertical_damping_ratio",
    paramtype=double_t,
    level=0,
    description="A dimensionless parameter that describes the extent to which oscillations in the vertical position decay after a disturbance.",
    default=1.0,
    min=0.7,
    max=1.0,
)
gen.add(
    name="vertical_i_gain",
    paramtype=double_t,
    level=0,
    description="Integral gain for vertical position control.",
    default=0.1,
    min=0.1,
    max=10.0,
)

gen.add(
    name="attitude_natural_frequency",
    paramtype=double_t,
    level=0,
    description="The rate at which the attitude angle oscillates in the absence of any damping or external forces.",
    default=10.0,
    min=1.0,
    max=20.0,
)
gen.add(
    name="attitude_damping_ratio",
    paramtype=double_t,
    level=0,
    description="A dimensionless parameter that describes the extent to which oscillations in the attitude angle decay after a disturbance.",
    default=1.0,
    min=0.7,
    max=1.0,
)
gen.add(
    name="attitude_i_gain",
    paramtype=double_t,
    level=0,
    description="Integral gain for attitude control.",
    default=0.1,
    min=0.1,
    max=40.0,
)

gen.add(
    name="heading_natural_frequency",
    paramtype=double_t,
    level=0,
    description="The rate at which the heading angle oscillates in the absence of any damping or external forces.",
    default=3.0,
    min=0.1,
    max=5.0,
)
gen.add(
    name="heading_damping_ratio",
    paramtype=double_t,
    level=0,
    description="A dimensionless parameter that describes the extent to which oscillations in the heading angle decay after a disturbance.",
    default=1.0,
    min=0.7,
    max=1.0,
)
gen.add(
    name="heading_i_gain",
    paramtype=double_t,
    level=0,
    description="Integral gain for heading control.",
    default=0.1,
    min=0.1,
    max=20.0,
)

gen.add(
    name="max_horizontal_accel",
    paramtype=double_t,
    level=0,
    description="[m/s^2] The maximum horizontal acceleration.",
    default=8.0,
    min=1.0,
    max=10.0,
)
gen.add(
    name="max_vertical_accel",
    paramtype=double_t,
    level=0,
    description="[m/s^2] The maximum vertical acceleration.",
    default=4.0,
    min=1.0,
    max=10.0,
)
gen.add(
    name="max_attitude",
    paramtype=double_t,
    level=0,
    description="[rad] The maximum attitude angle.",
    default=math.pi / 3,
    min=0.0,
    max=math.radians(89),
)

exit(
    gen.generate(
        rospkg.get_package_name(__file__),
        "tobas_mr_pid",
        osp.splitext(osp.basename(__file__))[0],
    )
)
