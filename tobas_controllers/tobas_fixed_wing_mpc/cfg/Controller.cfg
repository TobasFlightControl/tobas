

import os.path as osp
import rospkg
from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()

gen.add(
    name="prediction_horizon",
    paramtype=double_t,
    level=0,
    description="The length of time used to predict the future behavior",
    default=1.0,
    min=0.1,
    max=3.0,
)
gen.add(
    name="prediction_steps",
    paramtype=int_t,
    level=0,
    description="The number of future states computed by the predictive model",
    default=10,
    min=1,
    max=30,
)
gen.add(
    name="forward_speed_decay",
    paramtype=double_t,
    level=0,
    description="Time constant of the decay of the forward speed error [s]",
    default=0.3,
    min=0.0,
    max=1.0,
)
gen.add(
    name="alpha_decay",
    paramtype=double_t,
    level=0,
    description="Time constant of the decay of the angle of attack error [s]",
    default=0.3,
    min=0.0,
    max=1.0,
)
gen.add(
    name="beta_decay",
    paramtype=double_t,
    level=0,
    description="Time constant of the decay of the angle of sideslip error [s]",
    default=0.3,
    min=0.0,
    max=1.0,
)
gen.add(
    name="attitude_decay",
    paramtype=double_t,
    level=0,
    description="Time constant of the decay of the roll angle and pitch angle error [s]",
    default=0.3,
    min=0.0,
    max=1.0,
)
gen.add(
    name="angular_velocity_decay",
    paramtype=double_t,
    level=0,
    description="Time constant of the decay of the angular velocity error [s]",
    default=0.0,
    min=0.0,
    max=1.0,
)
gen.add(
    name="forward_speed_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of the forward speed",
    default=100,
    min=1,
    max=100,
)
gen.add(
    name="alpha_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of the angle of attack",
    default=100,
    min=1,
    max=100,
)
gen.add(
    name="beta_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of the angle of sideslip",
    default=100,
    min=1,
    max=100,
)
gen.add(
    name="attitude_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of roll angle and pitch angle",
    default=100,
    min=1,
    max=100,
)
gen.add(
    name="angular_velocity_weight",
    paramtype=int_t,
    level=0,
    description="Weighting of angular velocity",
    default=1,
    min=1,
    max=100,
)
gen.add(
    name="thrust_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the thrust generated by the propellers",
    default=-3,
    min=-3,
    max=3,
)
gen.add(
    name="thrust_rate_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the rate of change of thrust generated by the propellers",
    default=-3,
    min=-3,
    max=3,
)
gen.add(
    name="deflection_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the deflection angles of control surfaces",
    default=-3,
    min=-3,
    max=3,
)
gen.add(
    name="deflection_rate_weight_log10",
    paramtype=int_t,
    level=0,
    description="Weighting of the rate of change of deflection angles of control surfaces",
    default=-3,
    min=-3,
    max=3,
)

exit(
    gen.generate(
        rospkg.get_package_name(__file__),
        "tobas_fixed_wing_mpc",
        osp.splitext(osp.basename(__file__))[0],
    )
)
